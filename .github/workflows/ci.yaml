name: Build and test

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      # Test data and goldens are compared byte for byte.
      - name: Check out line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          dune-cache: true

      # opam installs SDL for the terminal demo with apt, whose index on the
      # runner can be stale.
      - name: Refresh the system package index
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install OCaml dependencies
        id: deps
        run: |
          # opam does not read the pins in dune-project; pin the same commits.
          awk -F'"' '/"git\+/ { url = $2 } url && /\(name / { sub(/.*\(name /, ""); sub(/\).*/, ""); print $0, url; url = "" }' dune-project |
            while read -r name url; do opam pin add -n "$name" "$url"; done
          opam install . --deps-only --with-test
          # For matrix's terminal emulator demo, which Windows does not build.
          if [ "$RUNNER_OS" != Windows ]; then opam install tsdl tsdl-ttf; fi

      - name: Build install targets
        run: opam exec -- dune build @install

      # Each package's tests run even when another's fail.
      - name: Build and test matrix
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build packages/matrix
          opam exec -- dune build @packages/matrix/runtest

      - name: Build and test toffee
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build packages/toffee
          opam exec -- dune build @packages/toffee/runtest

      - name: Build and test mosaic
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build packages/mosaic
          opam exec -- dune build @packages/mosaic/runtest

  # Allocation counts, exact and independent of load, against the `exact`
  # section of every benchmark baseline. They depend on the compiler and the
  # profile, so the job pins the compiler dune.lock names and builds in
  # release. Re-record with the command in packages/matrix/bench/README.md.
  bench-allocation:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.1
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          awk -F'"' '/"git\+/ { url = $2 } url && /\(name / { sub(/.*\(name /, ""); sub(/\).*/, ""); print $0, url; url = "" }' dune-project |
            while read -r name url; do opam pin add -n "$name" "$url"; done
          # The markdown suite measures cmarkit's parser: the version dune.lock names.
          opam pin add -n cmarkit 0.4.0
          opam install . --deps-only --with-test

      - name: Build the benchmarks in release
        run: opam exec -- dune build --profile release packages/matrix/bench packages/mosaic/bench packages/toffee/bench

      # --strict fails on a count that is not exact, a stale section or a new
      # case; a count that dropped proposes a row, which must be committed.
      - name: Check allocation counts
        run: |
          fail=0
          for exe in _build/default/packages/*/bench/bench_*.exe; do
            THUMPER_MACHINE=exact "$exe" --quick --strict --color never || fail=1
          done
          for corrected in packages/*/bench/*.thumper.corrected; do
            [ -e "$corrected" ] || continue
            diff -u "${corrected%.corrected}" "$corrected" || true
            fail=1
          done
          exit $fail

      - name: Upload the proposed baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-allocation-proposals
          path: packages/*/bench/*.thumper.corrected
          if-no-files-found: ignore
